name: CI (Release)
on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore FishstrapV2.sln

    - name: Build
      run: dotnet build FishstrapV2.sln -c Release --no-restore

    - name: Publish
      run: dotnet publish -p:PublishSingleFile=true -r win-x64 -c Release --self-contained false .\FishstrapV2\FishstrapV2.csproj

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        path: .\FishstrapV2\bin\Release\net8.0-windows\win-x64\publish\FishstrapV2.exe
        archive: false

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: FishstrapV2.exe
          name: Fishstrap V2 ${{ github.ref_name }}
          fail_on_unmatched_files: true

  release-test:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/release-test')
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: FishstrapV2.exe
          name: Fishstrap V2 ${{ github.ref_name }}
          fail_on_unmatched_files: true
